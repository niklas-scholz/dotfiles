# Kanagawa colors for tmux
# Background: #1f1f28 (Sumi Ink 1)
# Foreground: #dcd7ba (Fuji White)
# Selection:  #2a2a37 (Sumi Ink 2)
# Accent:     #7e9cd8 (Crystal Blue)
# Warning:    #ffa066 (Surimi Orange)

set-option -g status "on"

# default statusbar color
set-option -g status-style bg=#1f1f28,fg=#dcd7ba # sumiInk1, fujiWhite

# default window title colors
set-window-option -g window-status-style bg=#2a2a37,fg=#727169 # sumiInk2, fujiGray

# default window with an activity alert
set-window-option -g window-status-activity-style bg=#1f1f28,fg=#e6c384 # sumiInk1, autumnYellow

# active window title colors
set-window-option -g window-status-current-style bg=#c34043,fg=#1f1f28 # autumnRed, sumiInk1

# pane border
set-option -g pane-active-border-style fg=#7e9cd8 # crystalBlue
set-option -g pane-border-style fg=#2a2a37 # sumiInk2

# message infos
set-option -g message-style bg=#2a2a37,fg=#dcd7ba # sumiInk2, fujiWhite

# writing commands inactive
set-option -g message-command-style bg=#2a2a37,fg=#dcd7ba # sumiInk2, fujiWhite

# pane number display
set-option -g display-panes-active-colour #7e9cd8 # crystalBlue
set-option -g display-panes-colour #2a2a37 # sumiInk2

# clock
set-window-option -g clock-mode-colour #7e9cd8 # crystalBlue

# Theme settings
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

# Status Left: Session Name
set-option -g status-left "#[bg=#7e9cd8,fg=#1f1f28,bold] #S #[bg=#1f1f28,fg=#7e9cd8,nobold,noitalics,nounderscore]"

# Status Right: Date
set -g status-right "#[bg=#1f1f28,fg=#2a2a37,nobold,nounderscore,noitalics]#[bg=#2a2a37,fg=#938aa9] %Y-%m-%d  %H:%M #[bg=#2a2a37,fg=#7e9cd8,nobold,noitalics,nounderscore]#[bg=#7e9cd8,fg=#1f1f28]"

# Window Status Current: The active tab
set-window-option -g window-status-current-format "#[bg=#dca561,fg=#1f1f28,nobold,noitalics,nounderscore]#[bg=#dca561,fg=#1f1f28] #I #[bg=#dca561,fg=#1f1f28,bold] #W#{?window_zoomed_flag,*Z,} #[bg=#1f1f28,fg=#dca561,nobold,noitalics,nounderscore]"

# Window Status Format: Inactive tabs
set-window-option -g window-status-format "#[bg=#2a2a37,fg=#1f1f28,noitalics]#[bg=#2a2a37,fg=#dcd7ba] #I #[bg=#2a2a37,fg=#dcd7ba] #W #[bg=#1f1f28,fg=#2a2a37,noitalics]"
