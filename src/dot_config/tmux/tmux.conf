# -- general -------------------------------------------------------------------
# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
setw -g xterm-keys on
set -s escape-time 0                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on


# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# when closing a session, go to the next one
set-option -g detach-on-destroy off
# and close current session (above will automatically switch to next session)
bind q kill-session
bind T display-popup -E "tt"

# split panes using |,\ and -,_ in current path
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# Set new window to open in current directory
bind c new-window -c "#{pane_current_path}"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloading config..."
# Edit config file
bind e new-window -n ":e tmux.conf" sh -c 'nvim -c ":set syntax=tmux" ~/.config/tmux/tmux.conf && tmux source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"'

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# Set mouse off by default
set -g mouse on
# Toggle mouse
bind m run-shell 'tmux set -g mouse #{?mouse, off, on}'

# pane resizing
bind + resize-pane -Z
# resize if aaccidentally hitting +
bind = resize-pane -Z
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2


# Use Vim shortcuts
setw -g mode-keys vi

# History commands
bind-key -n M-l clear-history
bind C-l send-keys 'C-l'
bind l send-keys 'C-l'


# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

set-option -g status-interval 1
setw -g automatic-rename on   # rename window to reflect current folder
set-option -g automatic-rename-format '#(basename "#{pane_current_path}" | sed "s,^$(basename $HOME)$,~,")'

set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
# bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history
bind C-l send-keys 'C-l'


# activity
set -g monitor-activity on
set -g visual-activity off


# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

bind Tab last-window        # move to last active window

# Function key mappings
bind-key -T root F2 command-prompt -I "#W" "rename-window '%%'"
# Easy window switching
bind-key -T root F5 select-window -p
bind-key -T root F6 select-window -n
# binding for last window
bind-key -T root F3 select-window -l
bind-key -T root F9 new-window
bind-key -T root F10 new-session

set-window-option -g mode-keys vi
# entering vim mode to copy or scroll up with vim motions
bind 'v' copy-mode
bind -T root F1 copy-mode

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

source-file ~/.config/tmux/themes/tmux-kanagawa-dark.conf
set -g status-right '#[bg=colour237,fg=colour239 nobold, nounderscore, noitalics]#[bg=colour239,fg=colour246] %Y-%m-%d  %H:%M #[bg=colour239,fg=colour248,nobold,noitalics,nounderscore]#[bg=colour248,fg=colour237]'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
